# Dogfood: LocalCI checks itself. Copy to
# .github/workflows/localci.yml (via the GitHub web UI — the GitHub
# App cannot write workflow files).
#
# On every PR, capture in CI and diff against the baseline committed
# from a maintainer's laptop (.localci/local.json). If a contributor's
# PR changes a runtime or lockfile the laptop doesn't have, the check
# fails with the diff and a fix suggestion.
name: LocalCI dogfood

on:
  pull_request:

jobs:
  localci:
    runs-on: ubuntu-latest
    # Required for the PR comment: without pull-requests: write the
    # default token is read-only and `gh pr comment` fails with
    # "Resource not accessible by integration (addComment)" — this
    # is what the v0.7.1 dogfood run caught (the example workflows
    # had it, this file didn't).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: LocalCI check
        uses: Ciago-Technologies/local-ci@v0.7.2
        with:
          local-fingerprint: .localci/local.json
          workflows-dir: .github/workflows
          fail-on-diff: true
          comment-on-pr: true
