name: macOS verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Run macOS verify script
        run: bash scripts/verify-macos.sh
